name: CI

on:
  push:
    # A change of prose alone cannot break the build, and the fuzz smoke run below
    # takes half an hour, so a commit that only touches the documentation waits
    # for nothing.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - "NOTICE"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Only the library: the CLI turns its default features back on.
      - run: cargo clippy -p fermaid --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features pie -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features flowchart -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features sequence -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features state -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features class -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features er -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features requirement -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features timeline -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features journey -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features kanban -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features mindmap -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features gantt -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features sankey -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features xychart -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features quadrantchart -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features git -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features block -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features architecture -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features packet -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features radar -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features treemap -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features ishikawa -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features c4 -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features usecase -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features info -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features venn -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features treeview -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features cynefin -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features eventmodeling -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features wardley -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features railroad -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features swimlane -- -D warnings
      - run: cargo clippy -p fermaid --all-targets --no-default-features --features agentflow -- -D warnings
      - run: cargo test
      - run: cargo test -p fermaid --no-default-features

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Run each target for 60 seconds
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=60
          done
