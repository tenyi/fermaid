[package]
name = "fermaid"
description = "Render Mermaid diagram text to SVG in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["mermaid", "svg", "diagram"]
categories = ["visualization", "rendering"]

[features]
default = ["all"]
# Every diagram type. Each type gets its own feature as it lands.
all = ["class", "er", "flowchart", "pie", "requirement", "sequence", "state", "timeline", "journey", "kanban"]
class = []
er = []
requirement = []
flowchart = []
pie = []
sequence = []
state = []
timeline = []
journey = []
kanban = []

[dependencies]

[dev-dependencies]
insta = "1"
