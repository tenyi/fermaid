[package]
name = "fermaid"
description = "Render Mermaid diagram text to SVG in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["mermaid", "svg", "diagram"]
categories = ["visualization", "rendering"]

[features]
default = ["all"]
# Every diagram type. Each type gets its own feature as it lands.
all = ["flowchart", "pie", "sequence", "state"]
flowchart = []
pie = []
sequence = []
state = []
# In progress: not yet part of `all`.
class = []

[dependencies]

[dev-dependencies]
insta = "1"
